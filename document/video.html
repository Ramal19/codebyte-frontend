<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kurs Paneli - CodeByte</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --primary: #2da0fd;
            --primary-dark: #1a1c1e;
            --surface: #ffffff;
            --background: #f8f9fb;
            --text-main: #1f2937;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius-lg: 16px;
            --radius-md: 12px;
            --shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--background);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Desktop üçün */
        }

        /* Header */
        header {
            background: var(--primary-dark);
            height: 64px;
            display: flex;
            align-items: center;
            padding: 0 1.5rem;
            z-index: 1001;
            flex-shrink: 0;
        }

        .logo-box img { height: 28px; filter: brightness(0) invert(1); cursor: pointer; }

        /* Layout */
        .main-container {
            display: grid;
            grid-template-columns: 1fr 360px;
            flex: 1;
            overflow: hidden;
        }

        /* Content Area */
        .content-area {
            overflow-y: auto;
            padding: 20px;
            scroll-behavior: smooth;
        }

        .video-wrapper {
            background: #000;
            border-radius: var(--radius-md);
            overflow: hidden;
            box-shadow: var(--shadow);
            aspect-ratio: 16 / 9;
            margin-bottom: 20px;
            width: 100%;
        }

        #main-video { width: 100%; height: 100%; display: block; }

        /* Tabs */
        .tabs-nav {
            display: flex;
            gap: 10px;
            border-bottom: 2px solid var(--border);
            margin-bottom: 20px;
            background: var(--background);
            position: sticky;
            top: -20px;
            z-index: 10;
            padding-top: 5px;
            overflow-x: auto;
            scrollbar-width: none; /* Firefox */
        }
        .tabs-nav::-webkit-scrollbar { display: none; } /* Chrome/Safari */

        .tab-btn {
            background: none;
            border: none;
            padding: 12px 18px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            white-space: nowrap;
            position: relative;
            transition: 0.3s;
        }

        .tab-btn.active { color: var(--primary); }
        .tab-btn.active::after {
            content: ''; position: absolute; bottom: -2px; left: 0; width: 100%; height: 2px; background: var(--primary);
        }

        /* Sidebar */
        .sidebar {
            background: var(--surface);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 20px;
            font-weight: 700;
            border-bottom: 1px solid var(--border);
            background: #fff;
        }

        .video-list { flex: 1; overflow-y: auto; }

        .video-item {
            display: flex;
            padding: 12px 15px;
            gap: 12px;
            cursor: pointer;
            border-bottom: 1px solid #f8fafc;
            transition: 0.2s;
        }

        .video-item:hover { background: #f1f5f9; }
        .video-item.active { background: #eff6ff; border-left: 4px solid var(--primary); }

        .video-item img {
            width: 90px;
            aspect-ratio: 16/9;
            object-fit: cover;
            border-radius: 6px;
        }

        .video-item .info { display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
        .video-item .title { font-size: 0.85rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Cards */
        .glass-card {
            background: #fff;
            border-radius: var(--radius-md);
            padding: 20px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            body { overflow-y: auto; }
            .main-container { grid-template-columns: 1fr; overflow: visible; }
            .sidebar { border-left: none; border-top: 1px solid var(--border); height: auto; max-height: 600px; }
            .content-area { overflow-y: visible; }
        }

        @media (max-width: 600px) {
            .content-area { padding: 10px; }
            header { padding: 0 1rem; }
            .video-wrapper { border-radius: 0; margin-left: -10px; width: calc(100% + 20px); }
            .tab-btn { padding: 10px 12px; font-size: 0.85rem; }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo-box" onclick="window.location.href='../index.html'">
            <img src="../image/codebyteLogoMa.png" alt="Logo">
        </div>
    </header>

    <div class="main-container">
        <div class="content-area" id="scroll-target">
            <div class="video-wrapper">
                <video id="main-video" controls autoplay></video>
            </div>

            <nav class="tabs-nav">
                <button class="tab-btn active" onclick="showTab('overview', this)">Ümumi baxış</button>
                <button class="tab-btn" onclick="showTab('resources', this)">Resurslar</button>
                <button class="tab-btn" onclick="showTab('comments', this)">Rəylər</button>
            </nav>

            <div id="overview-tab" class="tab-pane">
                <div class="glass-card">
                    <h2 id="ov-title"></h2>
                    <p id="ov-cat" style="color: var(--primary); font-weight: 600; margin: 10px 0;"></p>
                    <div id="ov-desc" style="color: var(--text-muted); line-height: 1.6;"></div>
                </div>
            </div>

            <div id="resources-tab" class="tab-pane" style="display: none;">
                <div class="glass-card">
                    <h3>Dərs Materialları</h3>
                    <div id="document-list" style="margin-top:15px;"></div>
                </div>
            </div>

            <div id="comments-tab" class="tab-pane" style="display: none;">
                <div class="glass-card">
                    <h3>Şərhlər</h3>
                    <div style="margin-top:15px;">
                        <textarea id="comment-text" style="width:100%; padding:12px; border-radius:8px; border:1px solid var(--border); resize:none;" rows="3" placeholder="Fikrinizi yazın..."></textarea>
                        <button onclick="postComment()" class="tab-btn" style="background:var(--primary); color:white; border-radius:8px; margin-top:10px; float:right;">Göndər</button>
                        <div style="clear:both;"></div>
                    </div>
                    <div id="comments-list" style="margin-top:20px;"></div>
                </div>
            </div>
        </div>

        <aside class="sidebar">
            <div class="sidebar-header">Kursun Məzmunu</div>
            <div class="video-list" id="video-list"></div>
        </aside>
    </div>

    <script>
        const API_URL = "https://codebyte-backend-ibyq.onrender.com";
        const post = JSON.parse(localStorage.getItem("selectedPost"));

        if (!post) {
            window.location.href = "index.html";
        } else {
            document.getElementById("ov-title").textContent = post.text;
            document.getElementById("ov-cat").textContent = post.category || "Kateqoriya seçilməyib";
            document.getElementById("ov-desc").innerHTML = post.description || "Məlumat yoxdur.";

            const video = document.getElementById("main-video");
            const videoListContainer = document.getElementById("video-list");
            let currentVIndex = 0;

            // Video siyahısını yaratmaq
            post.videos.forEach((src, index) => {
                const item = document.createElement("div");
                item.className = `video-item ${index === 0 ? 'active' : ''}`;
                const title = post.videoTitles[index] || `Dərs ${index + 1}`;
                const thumb = post.videoCovers[index] || post.courseCover;

                item.innerHTML = `
                    <img src="${thumb}">
                    <div class="info">
                        <span class="title">${title}</span>
                        <small style="color:var(--text-muted)">Video dərs</small>
                    </div>
                `;

                item.onclick = () => {
                    // UI yeniləmə
                    document.querySelectorAll(".video-item").forEach(el => el.classList.remove("active"));
                    item.classList.add("active");
                    
                    // Video dəyişmə
                    video.src = src;
                    video.play();
                    currentVIndex = index;
                    
                    // Mobil üçün yuxarı sürüşdür
                    if (window.innerWidth < 1024) {
                        document.getElementById("scroll-target").scrollIntoView({ behavior: 'smooth' });
                    }

                    loadComments(post.id, index);
                };
                videoListContainer.appendChild(item);
            });

            // İlk video
            video.src = post.videos[0];
            loadComments(post.id, 0);

            // Tab funksiyası
            window.showTab = (tabName, btn) => {
                document.querySelectorAll(".tab-pane").forEach(p => p.style.display = 'none');
                document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove('active'));
                
                document.getElementById(`${tabName}-tab`).style.display = 'block';
                btn.classList.add('active');
            };

            // Materiallar
            const docList = document.getElementById("document-list");
            if(post.documents && post.documents.length > 0) {
                post.documents.forEach((doc, i) => {
                    docList.innerHTML += `
                        <a href="${doc}" target="_blank" style="display:flex; align-items:center; padding:12px; background:#f1f5f9; border-radius:8px; text-decoration:none; color:inherit; margin-bottom:10px;">
                            <i class="bi bi-file-earmark-pdf" style="font-size:1.4rem; color:red; margin-right:12px;"></i>
                            <span style="font-size:0.9rem; font-weight:500;">Resurs #${i+1}</span>
                        </a>
                    `;
                });
            } else {
                docList.innerHTML = "<p style='color:var(--text-muted)'>Material yüklənməyib.</p>";
            }

            // Komment funksiyaları
            async function loadComments(pid, vIdx) {
                const list = document.getElementById("comments-list");
                list.innerHTML = "Yüklənir...";
                try {
                    const res = await fetch(`${API_URL}/comments/${pid}/${vIdx}`);
                    const data = await res.json();
                    list.innerHTML = data.length ? "" : "Hələ rəy yoxdur.";
                    data.forEach(c => {
                        list.innerHTML += `
                            <div style="margin-bottom:15px; padding:10px; border-bottom:1px solid #eee;">
                                <strong>${c.username}</strong>
                                <p style="font-size:0.9rem; color:#555;">${c.text}</p>
                            </div>
                        `;
                    });
                } catch(e) { list.innerHTML = "Xəta baş verdi."; }
            }

            window.postComment = async () => {
                const token = localStorage.getItem('token');
                const text = document.getElementById("comment-text").value;
                if(!token) return Swal.fire("Giriş edin", "", "warning");
                if(!text.trim()) return;

                const res = await fetch(`${API_URL}/comments`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
                    body: JSON.stringify({ postId: post.id, videoIndex: currentVIndex, text })
                });

                if(res.ok) {
                    document.getElementById("comment-text").value = "";
                    loadComments(post.id, currentVIndex);
                }
            };
        }
    </script>
</body>
</html>
