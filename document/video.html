<!DOCTYPE html>
<html lang="az">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kurs Paneli - CodeByte</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --primary: #2da0fd;
            --primary-dark: #1a1c1e;
            --surface: #ffffff;
            --background: #f8f9fb;
            --text-main: #1f2937;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius-lg: 16px;
            --radius-md: 12px;
            --shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background: var(--primary-dark);
            height: 64px;
            display: flex;
            align-items: center;
            padding: 0 1.5rem;
            z-index: 1001;
            flex-shrink: 0;
        }

        .logo-box img {
            height: 28px;
            filter: brightness(0) invert(1);
            cursor: pointer;
        }

        .main-container {
            display: grid;
            grid-template-columns: 1fr 360px;
            flex: 1;
            overflow: hidden;
        }

        .content-area {
            overflow-y: auto;
            padding: 20px;
            scroll-behavior: smooth;
        }

        .video-wrapper {
            background: #000;
            border-radius: var(--radius-md);
            overflow: hidden;
            box-shadow: var(--shadow);
            aspect-ratio: 16 / 9;
            margin-bottom: 20px;
            width: 100%;
        }

        #main-video {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Accordion Sidebar */
        .sidebar {
            background: var(--surface);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 20px;
            font-weight: 700;
            border-bottom: 1px solid var(--border);
            background: #fff;
            display: flex;
            justify-content: space-between;
        }

        .module-list {
            flex: 1;
            overflow-y: auto;
        }

        /* Yeni Accordion Dizaynı */
        .module-group {
            border-bottom: 1px solid var(--border);
        }

        .module-toggle {
            width: 100%;
            padding: 15px;
            background: #f8fafc;
            border: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-main);
            transition: 0.2s;
        }

        .module-toggle:hover {
            background: #f1f5f9;
        }

        .video-items-container {
            display: none;
            /* Başlanğıcda bağlı olsun */
            background: #fff;
        }

        .module-group.active .video-items-container {
            display: block;
        }

        .module-group.active .module-toggle i {
            transform: rotate(180deg);
        }

        .video-item {
            display: flex;
            padding: 12px 15px;
            gap: 12px;
            cursor: pointer;
            transition: 0.2s;
            border-left: 3px solid transparent;
        }

        .video-item:hover {
            background: #f8faff;
        }

        .video-item.active {
            background: #eff6ff;
            border-left-color: var(--primary);
        }

        .video-item .v-icon {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .video-item.active .v-icon {
            color: var(--primary);
        }

        .video-item .info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .video-item .title {
            font-size: 0.85rem;
            font-weight: 500;
        }

        /* Digər elementlər */
        .tabs-nav {
            display: flex;
            gap: 10px;
            border-bottom: 2px solid var(--border);
            margin-bottom: 20px;
            background: var(--background);
            position: sticky;
            top: -20px;
            z-index: 10;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 12px 18px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            position: relative;
        }

        .tab-btn.active {
            color: var(--primary);
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--primary);
        }

        .glass-card {
            background: #fff;
            border-radius: var(--radius-md);
            padding: 20px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }

        @media (max-width: 1024px) {
            body {
                overflow-y: auto;
            }

            .main-container {
                grid-template-columns: 1fr;
            }

            .sidebar {
                max-height: 500px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo-box" onclick="window.location.href='../index.html'">
            <img src="../image/codebyteLogoMa.png" alt="Logo">
        </div>
    </header>

    <div class="main-container">
        <div class="content-area" id="scroll-target">
            <div class="video-wrapper">
                <video id="main-video" controls autoplay controlsList="nodownload"></video>
            </div>

            <nav class="tabs-nav">
                <button class="tab-btn active" onclick="showTab('overview', this)">Ümumi baxış</button>
                <button class="tab-btn" onclick="showTab('resources', this)">Resurslar</button>
                <button class="tab-btn" onclick="showTab('comments', this)">Rəylər</button>
            </nav>

            <div id="overview-tab" class="tab-pane">
                <div class="glass-card">
                    <h2 id="ov-title"></h2>
                    <p id="ov-cat" style="color: var(--primary); font-weight: 600; margin: 10px 0;"></p>
                    <div id="ov-desc" style="color: var(--text-muted); line-height: 1.6;"></div>
                </div>
            </div>

            <div id="resources-tab" class="tab-pane" style="display: none;">
                <div class="glass-card">
                    <h3>Dərs Materialları</h3>
                    <div id="document-list" style="margin-top:15px;"></div>
                </div>
            </div>

            <div id="comments-tab" class="tab-pane" style="display: none;">
                <div class="glass-card">
                    <h3>Şərhlər</h3>
                    <div style="margin-top:15px;">
                        <textarea id="comment-text"
                            style="width:100%; padding:12px; border-radius:8px; border:1px solid var(--border); resize:none;"
                            rows="3" placeholder="Fikrinizi yazın..."></textarea>
                        <button onclick="postComment()" class="tab-btn"
                            style="background:var(--primary); color:white; border-radius:8px; margin-top:10px; float:right;">Göndər</button>
                        <div style="clear:both;"></div>
                    </div>
                    <div id="comments-list" style="margin-top:20px;"></div>
                </div>
            </div>
        </div>

        <aside class="sidebar">
            <div class="sidebar-header">
                <span>Kursun Məzmunu</span>
                <i class="bi bi-list-task"></i>
            </div>
            <div class="module-list" id="module-container">
            </div>
        </aside>
    </div>

    <script>
        const API_URL = "https://codebyte-backend-ibyq.onrender.com";
        const post = JSON.parse(localStorage.getItem("selectedPost"));

        if (!post) {
            window.location.href = "index.html";
        } else {
            document.getElementById("ov-title").textContent = post.text;
            document.getElementById("ov-cat").textContent = post.category || "Kateqoriya seçilməyib";
            document.getElementById("ov-desc").innerHTML = post.description || "Bu kurs üçün əlavə məlumat qeyd edilməyib.";

            const video = document.getElementById("main-video");
            const moduleContainer = document.getElementById("module-container");

            let firstVideoUrl = "";
            let currentGlobalVIndex = 0; // Şərhlər üçün unikal indeks lazım ola bilər

            // MODUL STRUKTURUNU QURMAQ
            if (post.modules && post.modules.length > 0) {
                post.modules.forEach((module, mIdx) => {
                    const moduleDiv = document.createElement("div");
                    moduleDiv.className = `module-group ${mIdx === 0 ? 'active' : ''}`;

                    moduleDiv.innerHTML = `
                        <button class="module-toggle" onclick="toggleModule(this)">
                            <span>${module.moduleName}</span>
                            <i class="bi bi-chevron-down"></i>
                        </button>
                        <div class="video-items-container"></div>
                    `;

                    const videoContainer = moduleDiv.querySelector(".video-items-container");

                    module.videos.forEach((vData, vIdx) => {
                        if (!firstVideoUrl) firstVideoUrl = vData.videoUrl;

                        const vItem = document.createElement("div");
                        vItem.className = "video-item";
                        if (vData.videoUrl === firstVideoUrl) vItem.classList.add("active");

                        vItem.innerHTML = `
                            <div class="v-icon"><i class="bi bi-play-circle-fill"></i></div>
                            <div class="info">
                                <span class="title">${vData.title}</span>
                                ${vData.docUrl ? '<small style="color:var(--primary); font-size:0.7rem;"><i class="bi bi-file-earmark-pdf"></i> Resurs var</small>' : '<small style="color:var(--text-muted); font-size:0.7rem;">Video dərs</small>'}
                            </div>
                        `;

                        vItem.onclick = () => {
                            // UI Update
                            document.querySelectorAll(".video-item").forEach(el => el.classList.remove("active"));
                            vItem.classList.add("active");

                            // Video Change
                            video.src = vData.videoUrl;
                            video.play();

                            // Update Resources Tab
                            updateResources(vData);

                            // Load Comments (Modul daxili indeks istifadə edilə bilər və ya ümumi)
                            loadComments(post.id, `${mIdx}-${vIdx}`);

                            if (window.innerWidth < 1024) {
                                document.getElementById("scroll-target").scrollIntoView({ behavior: 'smooth' });
                            }
                        };

                        videoContainer.appendChild(vItem);
                    });

                    moduleContainer.appendChild(moduleDiv);
                });
            }

            // İlk videonu başlat
            video.src = firstVideoUrl;

            // İlk videonun resursunu və şərhlərini yüklə
            if (post.modules[0] && post.modules[0].videos[0]) {
                updateResources(post.modules[0].videos[0]);
                loadComments(post.id, "0-0");
            }

            // Accordion aç/bağla
            window.toggleModule = (btn) => {
                const group = btn.parentElement;
                group.classList.toggle("active");
            };

            // Resursları yeniləmə funksiyası (Hər videoya özəl)
            function updateResources(vData) {
                const docList = document.getElementById("document-list");
                docList.innerHTML = "";
                if (vData.docUrl) {
                    docList.innerHTML = `
                        <a href="${vData.docUrl}" target="_blank" style="display:flex; align-items:center; padding:12px; background:#f1f5f9; border-radius:8px; text-decoration:none; color:inherit; margin-bottom:10px;">
                            <i class="bi bi-file-earmark-pdf" style="font-size:1.4rem; color:red; margin-right:12px;"></i>
                            <span style="font-size:0.9rem; font-weight:500;">Dərs Materialı: ${vData.title}</span>
                        </a>
                    `;
                } else {
                    docList.innerHTML = "<p style='color:var(--text-muted)'>Bu dərs üçün əlavə material yoxdur.</p>";
                }
            }

            // Digər köməkçi funksiyalar (showTab, loadComments, postComment)
            window.showTab = (tabName, btn) => {
                document.querySelectorAll(".tab-pane").forEach(p => p.style.display = 'none');
                document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove('active'));
                document.getElementById(`${tabName}-tab`).style.display = 'block';
                btn.classList.add('active');
            };

            async function loadComments(pid, vIdx) {
                const list = document.getElementById("comments-list");
                list.innerHTML = "<small>Yüklənir...</small>";
                try {
                    const res = await fetch(`${API_URL}/comments/${pid}/${vIdx}`);
                    const data = await res.json();
                    list.innerHTML = data.length ? "" : "<p style='font-size:0.9rem; color:gray;'>Hələ rəy yoxdur.</p>";
                    data.forEach(c => {
                        list.innerHTML += `
                            <div style="margin-bottom:15px; padding:10px; border-bottom:1px solid #eee;">
                                <div style="display:flex; justify-content:space-between;">
                                    <strong>${c.username}</strong>
                                    <small style="color:gray;">${new Date(c.createdAt).toLocaleDateString()}</small>
                                </div>
                                <p style="font-size:0.9rem; color:#555; margin-top:5px;">${c.text}</p>
                            </div>
                        `;
                    });
                } catch (e) { list.innerHTML = "Xəta baş verdi."; }
            }

            window.postComment = async () => {
                const token = localStorage.getItem('token');
                const text = document.getElementById("comment-text").value;
                const activeVideo = document.querySelector(".video-item.active");

                // Aktiv videonun modul-indeksini tapmaq lazımdır (loadComments üçün istifadə etdiyimiz formatda)
                // Sadəlik üçün hazırda aktiv olan şərhləri yeniləyəcək.

                if (!token) return Swal.fire("Giriş edin", "Rəy yazmaq üçün daxil olmalısınız", "warning");
                if (!text.trim()) return;

                // Backend-ə uyğun videoIndex tapılmalıdır
                // ... (Bu hissə sənin backend rəy sisteminə görə tənzimlənə bilər)

                const res = await fetch(`${API_URL}/comments`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
                    body: JSON.stringify({ postId: post.id, videoIndex: "0-0", text }) // Nümunə index
                });

                if (res.ok) {
                    document.getElementById("comment-text").value = "";
                    loadComments(post.id, "0-0");
                }
            };
        }
    </script>
</body>

</html>
