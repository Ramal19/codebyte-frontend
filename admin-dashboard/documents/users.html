<!DOCTYPE html>
<html lang="az">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeByte - Admin Panel</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f2f5;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #1a73e8;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .controls {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        #search, #roleFilter {
            flex-grow: 1;
            padding: 12px 15px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            transition: border-color 0.3s;
            min-width: 200px;
        }

        #search:focus, #roleFilter:focus {
            border-color: #1a73e8;
            outline: none;
            box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.1);
        }

        #users-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        #users-table thead th {
            background-color: #1a73e8;
            color: white;
            padding: 15px;
            text-align: left;
        }

        #users-table tbody td {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
            vertical-align: middle;
        }

        /* Profil Avatar Stilləri */
        .avatar-container {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #e2e8f0;
            border: 2px solid #f8f9fa;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar-initials {
            font-size: 16px;
            font-weight: bold;
            color: #4a5568;
            text-transform: uppercase;
        }

        /* Rol rəngləri */
        .role-user { color: #28a745; font-weight: 600; }
        .role-teacher { color: #ffc107; font-weight: 600; }
        .role-admin { color: #dc3545; font-weight: 600; }

        button.delete-btn {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 6px;
            transition: 0.3s;
        }

        button.delete-btn:hover { background-color: #c82333; }

        .info-message { text-align: center; padding: 20px; font-weight: 600; }

        @media (max-width: 768px) {
            .controls { flex-direction: column; }
            #users-table thead { display: none; }
            #users-table td {
                display: block;
                text-align: right;
                padding-left: 50%;
                position: relative;
            }
            #users-table td::before {
                content: attr(data-label);
                position: absolute;
                left: 10px;
                font-weight: 600;
                color: #555;
            }
            .avatar-container { margin-left: auto; }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>İstifadəçilərin İdarəetmə Paneli</h1>

        <div class="controls">
            <input type="text" id="search" placeholder="İstifadəçi adı və ya email ilə axtar...">
            <select id="roleFilter">
                <option value="">Bütün Rollar</option>
                <option value="user">User</option>
                <option value="teacher">Teacher</option>
                <option value="admin">Admin</option>
            </select>
        </div>

        <table id="users-table">
            <thead>
                <tr>
                    <th>№</th>
                    <th>Şəkil</th>
                    <th>İstifadəçi Adı</th>
                    <th>Email</th>
                    <th>Rol</th>
                    <th>Əməliyyat</th>
                </tr>
            </thead>
            <tbody>
                </tbody>
        </table>
    </div>

    <script>
        const API_BASE_URL = "https://codebyte-backend-ibyq.onrender.com";
        const USERS_API_URL = `${API_BASE_URL}/users`;

        const tableBody = document.querySelector("#users-table tbody");
        const searchInput = document.querySelector("#search");
        const roleFilter = document.querySelector("#roleFilter");

        let allUsers = [];
        const labels = ["№", "Şəkil", "İstifadəçi Adı", "Email", "Rol", "Əməliyyat"];

        // Baş hərfləri götürən funksiya
        function getInitials(name) {
            if (!name) return "?";
            const parts = name.trim().split(' ');
            if (parts.length >= 2) {
                return (parts[0][0] + parts[1][0]).toUpperCase();
            }
            return name.substring(0, 2).toUpperCase();
        }

        async function fetchUsers() {
            tableBody.innerHTML = `<tr><td colspan="6" class="info-message">Məlumatlar yüklənir...</td></tr>`;
            const token = localStorage.getItem('token');

            if (!token) {
                tableBody.innerHTML = `<tr><td colspan="6" class="info-message" style="color:red;">Giriş tokeni tapılmadı. Zəhmət olmasa daxil olun.</td></tr>`;
                return;
            }

            try {
                const response = await fetch(USERS_API_URL, {
                    headers: { "Authorization": `Bearer ${token}` }
                });

                if (!response.ok) throw new Error("Məlumatları gətirmək mümkün olmadı.");

                allUsers = await response.json();
                applyFilters();
            } catch (error) {
                tableBody.innerHTML = `<tr><td colspan="6" class="info-message">Xəta: ${error.message}</td></tr>`;
            }
        }

        function displayUsers(users) {
            tableBody.innerHTML = "";
            if (users.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="6" class="info-message">İstifadəçi tapılmadı.</td></tr>`;
                return;
            }

            users.forEach((user, index) => {
                const row = tableBody.insertRow();

                // 1. №
                row.insertCell().textContent = index + 1;

                // 2. Profil Şəkli / Baş Hərf
                const avatarCell = row.insertCell();
                const container = document.createElement("div");
                container.className = "avatar-container";

                if (user.profilePic) {
                    const img = document.createElement("img");
                    img.src = user.profilePic;
                    img.className = "avatar-img";
                    img.onerror = function() {
                        this.parentElement.innerHTML = `<span class="avatar-initials">${getInitials(user.username)}</span>`;
                    };
                    container.appendChild(img);
                } else {
                    container.innerHTML = `<span class="avatar-initials">${getInitials(user.username)}</span>`;
                }
                avatarCell.appendChild(container);

                // 3. Username
                row.insertCell().textContent = user.username;

                // 4. Email
                row.insertCell().textContent = user.email;

                // 5. Role
                const rCell = row.insertCell();
                rCell.textContent = user.role || 'user';
                rCell.className = `role-${(user.role || 'user').toLowerCase()}`;

                // 6. Delete Button
                const actionCell = row.insertCell();
                const btn = document.createElement("button");
                btn.textContent = "Sil";
                btn.className = "delete-btn";
                btn.onclick = () => deleteUser(user.id);
                actionCell.appendChild(btn);

                // Add labels for mobile responsive
                Array.from(row.cells).forEach((cell, i) => cell.setAttribute('data-label', labels[i]));
            });
        }

        async function deleteUser(id) {
            const result = await Swal.fire({
                title: 'Əminsiniz?',
                text: "İstifadəçi tamamilə silinəcək!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Bəli, Sil!',
                cancelButtonText: 'Ləğv et'
            });

            if (result.isConfirmed) {
                const token = localStorage.getItem('token');
                try {
                    const res = await fetch(`${USERS_API_URL}/${id}`, {
                        method: "DELETE",
                        headers: { "Authorization": `Bearer ${token}` }
                    });
                    if (res.ok) {
                        Swal.fire('Silindi!', '', 'success');
                        allUsers = allUsers.filter(u => u.id !== id);
                        applyFilters();
                    } else {
                        throw new Error("Silinmə zamanı xəta.");
                    }
                } catch (e) {
                    Swal.fire('Xəta!', e.message, 'error');
                }
            }
        }

        function applyFilters() {
            const query = searchInput.value.toLowerCase();
            const role = roleFilter.value;
            const filtered = allUsers.filter(u => 
                (u.username.toLowerCase().includes(query) || u.email.toLowerCase().includes(query)) &&
                (role === "" || u.role === role)
            );
            displayUsers(filtered);
        }

        searchInput.addEventListener("input", applyFilters);
        roleFilter.addEventListener("change", applyFilters);

        fetchUsers();
    </script>
</body>
</html>
